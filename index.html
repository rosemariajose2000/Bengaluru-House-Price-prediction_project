<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>House Price Predictor</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-dark">

<div class="container">
    <div class="row justify-content-center">
        <div class="card mt-5">

            <div class="card-header text-center">
                <h1>Welcome to House Price Predictor</h1>
            </div>

            <div class="card-body">
                <form id="predict-form">

                    <div class="row">

                        <div class="col-md-3 text-center">
                            <label><b>Select Location</b></label>
                            <select class="form-control" name="location" required>
                                {% for location in locations %}
                                <option value="{{location}}">{{location}}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="col-md-3 text-center">
                            <label><b>BHK</b></label>
                            <input type="number" class="form-control" name="bhk" required>
                        </div>

                        <div class="col-md-3 text-center">
                            <label><b>Bathrooms</b></label>
                            <input type="number" class="form-control" name="bath" required>
                        </div>

                        <div class="col-md-3 text-center">
                            <label><b>Square Feet</b></label>
                            <input type="number" class="form-control" name="total_sqft" required>
                        </div>

                        <div class="col-md-12 mt-3">
                            <button type="button" class="btn btn-primary w-100" onclick="send_data()">
                                Predict Price
                            </button>
                        </div>

                    </div>
                </form>

                <h3 class="text-center mt-3">
                    <span id="prediction"></span>
                </h3>
            </div>

        </div>
    </div>
</div>

<script>
function send_data() {
    let form = document.getElementById("predict-form");
    let fd = new FormData(form);

    let xhr = new XMLHttpRequest();
    xhr.open("POST", "/predict", true);

    document.getElementById("prediction").innerHTML = "Predicting price...";

    xhr.onreadystatechange = function () {
        if (xhr.readyState === XMLHttpRequest.DONE) {
            document.getElementById("prediction").innerHTML =
                "Prediction Price: ₹ " + xhr.responseText;
        }
    };

    xhr.send(fd);
}
</script>

</body>
</html>
